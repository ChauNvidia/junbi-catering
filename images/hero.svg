<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6efdd"/><stop offset="1" stop-color="#e3dcc4"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a566"/><stop offset="1" stop-color="#a9743d"/></linearGradient>
<linearGradient id="matcha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bbf5a"/><stop offset="1" stop-color="#5e8a35"/></linearGradient>
<radialGradient id="glow" cx=".25" cy=".2" r=".7"><stop offset="0" stop-color="#fff8e1" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e1" stop-opacity="0"/></radialGradient>
<filter id="b"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#wall)"/>
<rect width="1200" height="900" fill="url(#glow)"/>
<!-- window light -->
<g opacity=".55"><rect x="640" y="60" width="150" height="360" rx="8" fill="#fffdf2"/><rect x="820" y="60" width="150" height="360" rx="8" fill="#fffdf2"/></g>
<!-- blurred plants -->
<g filter="url(#b)"><circle cx="120" cy="200" r="150" fill="#6f9a52"/><circle cx="1090" cy="170" r="140" fill="#7ea35a"/><circle cx="1000" cy="330" r="90" fill="#5f8b46"/></g>
<!-- flowers -->
<g><rect x="95" y="470" width="150" height="150" rx="20" fill="#2f4a38"/>
<g fill="#fffaf0"><circle cx="130" cy="430" r="50"/><circle cx="195" cy="410" r="58"/><circle cx="165" cy="470" r="44"/><circle cx="225" cy="455" r="38"/></g>
<g fill="#ece0c6"><circle cx="130" cy="430" r="20"/><circle cx="195" cy="410" r="24"/></g>
<g fill="#4f7d3d"><ellipse cx="90" cy="480" rx="40" ry="18" transform="rotate(-30 90 480)"/><ellipse cx="250" cy="490" rx="40" ry="18" transform="rotate(25 250 490)"/></g></g>
<!-- counter -->
<rect x="0" y="600" width="1200" height="300" fill="url(#wood)"/>
<rect x="0" y="600" width="1200" height="26" fill="#e8bd83"/>
<g stroke="#8f5f2f" stroke-opacity=".25" stroke-width="3"><path d="M0 700h1200M0 790h1200M0 860h1200"/></g>
<text x="600" y="800" text-anchor="middle" font-family="Georgia,serif" font-size="70" letter-spacing="26" fill="#6c4524" fill-opacity=".8">JUNBI</text>
<!-- shadows -->
<ellipse cx="470" cy="628" rx="330" ry="14" fill="#5a3a1c" opacity=".25"/>
<!-- tea canisters -->
<rect x="300" y="500" width="62" height="100" rx="8" fill="#1f2622"/><rect x="305" y="485" width="52" height="18" rx="4" fill="#2b332e"/>
<rect x="378" y="520" width="52" height="80" rx="8" fill="#222a25"/>
<!-- bowl -->
<ellipse cx="550" cy="598" rx="100" ry="12" fill="#00000022"/>
<path d="M455 520 Q455 598 550 598 Q645 598 645 520 Z" fill="#6f8f4a"/>
<ellipse cx="550" cy="520" rx="95" ry="26" fill="#a6c46a"/><ellipse cx="550" cy="520" rx="80" ry="19" fill="url(#matcha)"/>
<ellipse cx="530" cy="514" rx="30" ry="6" fill="#c9de97" opacity=".7"/>
<!-- whisk -->
<g transform="translate(690 520)"><rect x="-17" y="-60" width="34" height="62" rx="6" fill="#d9bb7e"/><path d="M-17 2 Q-40 50 -12 80 L12 80 Q40 50 17 2Z" fill="#e8d4a0"/><g stroke="#b8975a" stroke-width="2"><path d="M-10 6V78M0 6V80M10 6V78"/></g></g>
<!-- cups -->
<g><path d="M790 430 L880 430 L866 598 L804 598Z" fill="#dfeccf" opacity=".95"/><path d="M793 470 L877 470 L866 598 L804 598Z" fill="url(#matcha)"/><rect x="784" y="414" width="102" height="20" rx="8" fill="#f4f7ee"/><text x="835" y="545" text-anchor="middle" font-family="Georgia,serif" font-size="22" letter-spacing="5" fill="#f1f6e0" opacity=".9">JUNBI</text></g>
<g><path d="M915 455 L995 455 L983 598 L927 598Z" fill="#f0e6d2" opacity=".95"/><path d="M918 495 L992 495 L983 598 L927 598Z" fill="#c9a77a"/><path d="M918 495 L992 495 L989 520 L921 520Z" fill="#e9d6b3"/><rect x="908" y="441" width="94" height="18" rx="8" fill="#f4f7ee"/></g>
<!-- sign -->
<g transform="translate(1000 330) rotate(3)"><rect width="150" height="200" fill="#fbf8ef" stroke="#2a2a2a" stroke-width="5"/><text x="75" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="24" letter-spacing="6" fill="#2a2a2a">JUNBI</text><g font-family="Inter,Arial" font-size="11" letter-spacing="3" fill="#555" text-anchor="middle"><text x="75" y="100">MATCHA</text><text x="75" y="125">PEOPLE</text><text x="75" y="150">COMMUNITY</text><text x="75" y="175">TOGETHER</text></g></g>
<!-- barista -->
<g><path d="M560 330 q0 -100 80 -100 q80 0 80 100 v110 h-160z" fill="#00000000"/></g>
</svg>
